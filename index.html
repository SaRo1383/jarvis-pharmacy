<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jarvis Pharmacy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 800px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 13px 17px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .jarvis {
      background: white;
      margin-left: auto;
    }

    .user {
      background: #dbeafe;
      margin-right: auto;
    }

    #status {
      padding: 5px 15px;
      color: #777;
      font-size: 13px;
      min-height: 25px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #command {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 25px;
      padding: 13px 17px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 21px;
    }

    #mic {
      background: #eeeeee;
    }

    #mic.recording {
      background: #ef4444;
      color: white;
    }

    #send {
      background: #222;
      color: white;
    }
  </style>

</head>


<body>

<div class="app">

  <header>
    💊 JARVIS Pharmacy
  </header>


  <div id="chat">

    <div class="message jarvis">
      سلام 👋
      من جارویس هستم.
      می‌تونی با من صحبت کنی یا تایپ کنی.
    </div>

  </div>


  <div id="status"></div>


  <div class="input-area">

    <button id="mic" onclick="toggleMic()">
      🎙️
    </button>

    <input
      id="command"
      type="text"
      placeholder="دستور خود را بنویس..."
      onkeydown="if(event.key === 'Enter') sendCommand()"
    >

    <button id="send" onclick="sendCommand()">
      ➤
    </button>

  </div>

</div>


<script>

/* =====================================================
   تنظیمات
===================================================== */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbx4hP0QhM9g6BJmZ7v2s-y2nI_XY9tyZtb7BfhJwvEtf1ydHPNPqtG8QiALIAdpMKw_-Q/exec';


let recognition = null;

let recording = false;


/* =====================================================
   نمایش پیام
===================================================== */

function addMessage(text, type) {

  const chat =
    document.getElementById('chat');

  const message =
    document.createElement('div');

  message.className =
    'message ' + type;

  message.textContent =
    text;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =====================================================
   وضعیت
===================================================== */

function setStatus(text) {

  document
    .getElementById('status')
    .textContent = text;

}


/* =====================================================
   میکروفون
===================================================== */

function toggleMic() {

  if (recording) {

    stopMic();

  } else {

    startMic();

  }

}


function startMic() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    addMessage(
      '❌ مرورگر شما از تشخیص گفتار پشتیبانی نمی‌کند.',
      'jarvis'
    );

    return;
  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    'fa-IR';


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.onstart =
    function() {

      recording = true;

      document
        .getElementById('mic')
        .classList
        .add('recording');

      setStatus(
        '🎙️ گوش می‌دهم...'
      );

    };


  recognition.onresult =
    function(event) {

      const text =
        event
          .results[0][0]
          .transcript;


      document
        .getElementById('command')
        .value = text;


      stopMic();


      sendCommand();

    };


  recognition.onerror =
    function(event) {

      recording = false;

      document
        .getElementById('mic')
        .classList
        .remove('recording');


      setStatus('');


      addMessage(
        '❌ خطای میکروفون: ' +
        event.error,
        'jarvis'
      );

    };


  recognition.onend =
    function() {

      recording = false;

      document
        .getElementById('mic')
        .classList
        .remove('recording');


      setStatus('');

    };


  recognition.start();

}


function stopMic() {

  if (
    recognition &&
    recording
  ) {

    recognition.stop();

  }


  recording = false;


  document
    .getElementById('mic')
    .classList
    .remove('recording');

}


/* =====================================================
   ارسال دستور به جارویس
===================================================== */

async function sendCommand() {

  const input =
    document.getElementById('command');


  const command =
    input.value.trim();


  if (!command) {
    return;
  }


  addMessage(
    command,
    'user'
  );


  input.value = '';


  setStatus(
    '🤖 جارویس در حال پردازش...'
  );


  /*
   * فعلاً برای تست صدا یک جواب ثابت داریم.
   * بعداً همین قسمت به Gemini + Google Sheets
   * وصل می‌شود.
   */

  const answer =
    'سلام، من جارویس هستم. صدای من با Gemini فعال شده است.';


  addMessage(
    answer,
    'jarvis'
  );


  setStatus(
    '🔊 در حال آماده‌سازی صدا...'
  );


  try {

    await playGeminiTTS(answer);

    setStatus('');

  }

  catch (error) {

    console.error(error);

    setStatus('');

    addMessage(
      '❌ خطا در پخش صدای جارویس: ' +
      error.message,
      'jarvis'
    );

  }

}


/* =====================================================
   درخواست صدای Gemini
===================================================== */

async function playGeminiTTS(text) {

  const response =
    await fetch(
      APPS_SCRIPT_URL,
      {

        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify({

            action: 'tts',

            text: text

          })

      }
    );


  if (!response.ok) {

    throw new Error(
      'HTTP ' +
      response.status
    );

  }


  const result =
    await response.json();


  if (!result.success) {

    throw new Error(
      result.error ||
      'Gemini TTS خطا داد.'
    );

  }


  if (!result.audio) {

    throw new Error(
      'فایل صوتی دریافت نشد.'
    );

  }


  const pcmBytes =
    base64ToUint8Array(
      result.audio
    );


  const wavBuffer =
    pcmToWav(
      pcmBytes,
      24000,
      1,
      16
    );


  const blob =
    new Blob(
      [wavBuffer],
      {
        type:
          'audio/wav'
      }
    );


  const audioURL =
    URL.createObjectURL(
      blob
    );


  const audio =
    new Audio(
      audioURL
    );


  audio.volume = 1;


  await audio.play();


  audio.onended =
    function() {

      URL.revokeObjectURL(
        audioURL
      );

    };

}


/* =====================================================
   Base64 → Uint8Array
===================================================== */

function base64ToUint8Array(base64) {

  const binary =
    atob(base64);


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);

  }


  return bytes;

}


/* =====================================================
   PCM → WAV
===================================================== */

function pcmToWav(
  pcmData,
  sampleRate,
  numChannels,
  bitsPerSample
) {

  const byteRate =
    sampleRate *
    numChannels *
    bitsPerSample / 8;


  const blockAlign =
    numChannels *
    bitsPerSample / 8;


  const buffer =
    new ArrayBuffer(
      44 +
      pcmData.length
    );


  const view =
    new DataView(
      buffer
    );


  function writeString(
    offset,
    string
  ) {

    for (
      let i = 0;
      i < string.length;
      i++
    ) {

      view.setUint8(
        offset + i,
        string.charCodeAt(i)
      );

    }

  }


  writeString(
    0,
    'RIFF'
  );


  view.setUint32(
    4,
    36 + pcmData.length,
    true
  );


  writeString(
    8,
    'WAVE'
  );


  writeString(
    12,
    'fmt '
  );


  view.setUint32(
    16,
    16,
    true
  );


  view.setUint16(
    20,
    1,
    true
  );


  view.setUint16(
    22,
    numChannels,
    true
  );


  view.setUint32(
    24,
    sampleRate,
    true
  );


  view.setUint32(
    28,
    byteRate,
    true
  );


  view.setUint16(
    32,
    blockAlign,
    true
  );


  view.setUint16(
    34,
    bitsPerSample,
    true
  );


  writeString(
    36,
    'data'
  );


  view.setUint32(
    40,
    pcmData.length,
    true
  );


  new Uint8Array(
    buffer,
    44
  ).set(
    pcmData
  );


  return buffer;

}

</script>

</body>

</html>
