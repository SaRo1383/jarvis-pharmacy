<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jarvis Pharmacy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .app {
      max-width: 800px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      font-size: 21px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .jarvis {
      background: white;
      margin-left: auto;
    }

    .user {
      background: #dbeafe;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #command {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 25px;
      padding: 13px 17px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 21px;
    }

    #mic {
      background: #eee;
    }

    #send {
      background: #222;
      color: white;
    }

    #mic.recording {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    💊 JARVIS Pharmacy
  </header>

  <div id="chat">

    <div class="message jarvis">
      سلام 👋
      من جارویس هستم.
      می‌تونی تایپ کنی یا با میکروفون صحبت کنی.
    </div>

  </div>

  <div class="input-area">

    <button id="mic" onclick="toggleMic()">
      🎙️
    </button>

    <input
      id="command"
      type="text"
      placeholder="دستور خود را بنویس..."
      onkeydown="if(event.key === 'Enter') sendCommand()"
    >

    <button id="send" onclick="sendCommand()">
      ➤
    </button>

  </div>

</div>


<script>

let mediaRecorder = null;
let audioChunks = [];
let recording = false;


/* =========================
   CHAT
========================= */

function addMessage(text, type) {

  const chat =
    document.getElementById('chat');

  const message =
    document.createElement('div');

  message.className =
    'message ' + type;

  message.textContent =
    text;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   TEXT COMMAND
========================= */

function sendCommand() {

  const input =
    document.getElementById('command');

  const command =
    input.value.trim();

  if (!command) return;

  addMessage(command, 'user');

  input.value = '';

  /*
   * فعلاً فقط تست رابط کاربری.
   * اتصال به Apps Script را
   * در مرحله بعد اضافه می‌کنیم.
   */

  setTimeout(function() {

    addMessage(
      'دستور دریافت شد: ' + command,
      'jarvis'
    );

  }, 500);
}


/* =========================
   MICROPHONE
========================= */

async function toggleMic() {

  if (recording) {

    stopMic();

  } else {

    await startMic();

  }
}


async function startMic() {

  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });

    audioChunks = [];

    mediaRecorder =
      new MediaRecorder(stream);

    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data.size > 0) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      function() {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        addMessage(
          '🎙️ صدا ضبط شد. اتصال به Gemini را در مرحله بعد اضافه می‌کنیم.',
          'jarvis'
        );

      };


    mediaRecorder.start();

    recording = true;

    document
      .getElementById('mic')
      .classList
      .add('recording');

  }

  catch (error) {

    addMessage(
      '❌ دسترسی به میکروفون انجام نشد: ' +
      error.message,
      'jarvis'
    );

  }
}


function stopMic() {

  if (
    mediaRecorder &&
    mediaRecorder.state !== 'inactive'
  ) {

    mediaRecorder.stop();

  }

  recording = false;

  document
    .getElementById('mic')
    .classList
    .remove('recording');
}

</script>

</body>
</html>
