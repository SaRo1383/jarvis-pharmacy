<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jarvis Pharmacy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .app {
      max-width: 800px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      font-size: 21px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .jarvis {
      background: white;
      margin-left: auto;
    }

    .user {
      background: #dbeafe;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #command {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 25px;
      padding: 13px 17px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 21px;
    }

    #mic {
      background: #eee;
    }

    #mic.recording {
      background: #ef4444;
      color: white;
    }

    #send {
      background: #222;
      color: white;
    }

    #status {
      padding: 5px 15px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    💊 JARVIS Pharmacy
  </header>

  <div id="chat">

    <div class="message jarvis">
      سلام 👋
      من جارویس هستم.
      می‌تونی با من تایپ کنی یا صحبت کنی.
    </div>

  </div>

  <div id="status"></div>

  <div class="input-area">

    <button id="mic" onclick="toggleMic()">
      🎙️
    </button>

    <input
      id="command"
      type="text"
      placeholder="دستور خود را بنویس..."
      onkeydown="if(event.key === 'Enter') sendCommand()"
    >

    <button id="send" onclick="sendCommand()">
      ➤
    </button>

  </div>

</div>


<script>

let recognition = null;
let recording = false;


/* =========================
   پیام
========================= */

function addMessage(text, type) {

  const chat =
    document.getElementById('chat');

  const message =
    document.createElement('div');

  message.className =
    'message ' + type;

  message.textContent =
    text;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   صدای جارویس
========================= */

function speak(text) {

  if (!('speechSynthesis' in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = 'fa-IR';
  utterance.rate = 0.95;
  utterance.pitch = 1;

  window.speechSynthesis.speak(
    utterance
  );
}


/* =========================
   ارسال متن
========================= */

function sendCommand() {

  const input =
    document.getElementById('command');

  const command =
    input.value.trim();

  if (!command) {
    return;
  }

  addMessage(
    command,
    'user'
  );

  input.value = '';

  /*
   * فعلاً فقط تست می‌کنیم
   * که جارویس با صدا جواب بدهد.
   */

  const answer =
    'دستور شما دریافت شد.';

  addMessage(
    answer,
    'jarvis'
  );

  speak(answer);
}


/* =========================
   میکروفون
========================= */

function toggleMic() {

  if (recording) {

    stopMic();

  } else {

    startMic();

  }
}


/* =========================
   شروع میکروفون
========================= */

function startMic() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    addMessage(
      'مرورگر شما از تشخیص گفتار پشتیبانی نمی‌کند.',
      'jarvis'
    );

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    'fa-IR';

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart =
    function() {

      recording = true;

      document
        .getElementById('mic')
        .classList
        .add('recording');

      document
        .getElementById('status')
        .textContent =
        '🎙️ گوش می‌دهم...';

    };


  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0]
          .transcript;

      document
        .getElementById('command')
        .value = text;

      stopMic();

      sendCommand();

    };


  recognition.onerror =
    function(event) {

      recording = false;

      document
        .getElementById('mic')
        .classList
        .remove('recording');

      document
        .getElementById('status')
        .textContent = '';

      addMessage(
        '❌ خطای میکروفون: ' +
        event.error,
        'jarvis'
      );

    };


  recognition.onend =
    function() {

      recording = false;

      document
        .getElementById('mic')
        .classList
        .remove('recording');

      document
        .getElementById('status')
        .textContent = '';

    };


  recognition.start();
}


/* =========================
   توقف میکروفون
========================= */

function stopMic() {

  if (
    recognition &&
    recording
  ) {

    recognition.stop();

  }

  recording = false;

  document
    .getElementById('mic')
    .classList
    .remove('recording');

}

</script>

</body>
</html>
